app.upload-root=uploads

# Local development should not block trace writing when the FastAPI filter is not running.
# Set PROFANITY_FILTER_ENABLED=true to test the filter through Spring Backend.
profanity.filter.enabled=${PROFANITY_FILTER_ENABLED:false}
profanity.filter.base-url=${PROFANITY_FILTER_BASE_URL:http://127.0.0.1:8001}
profanity.filter.fail-open=${PROFANITY_FILTER_FAIL_OPEN:false}
